<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>玥玥和程程的学习小屋</title>
<style>
  :root{
    --page:#fdf6ea;            /* 暖米色底 */
    --card:#ffffff;
    --ink:#4a3b32;             /* 暖深棕 */
    --ink-soft:#9c8b7d;
    --line:#f0e3ce;
    --accent:#ff8a4c;
    --accent-deep:#f2702e;
    --gold:#ffc94d;
    --yue:#ff8a7a;
    --yue-bg:#ffe6de;
    --cheng:#e6a23c;
    --cheng-bg:#ffefd1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;padding:0 16px calc(48px + env(safe-area-inset-bottom));
    background:var(--page);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    font-size:18px;line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:700px;margin:0 auto;position:relative;}

  /* ===== 1. 顶部标题 ===== */
  header{text-align:center;padding:50px 8px 14px;position:relative;}
  header h1{font-size:32px;margin:0 0 4px;letter-spacing:1px;}
  header .sub{color:var(--ink-soft);font-size:18px;margin:0;}
  header .date-weather{
    position:absolute;top:10px;right:4px;
    color:var(--ink-soft);font-size:13px;line-height:1.5;text-align:right;
    max-width:60%;
  }

  /* ===== 2. 模式切换 ===== */
  .mode-switch{
    display:flex;gap:6px;background:#f3e6cf;border-radius:16px;
    padding:6px;margin:14px 0 22px;
  }
  .mode-switch button{
    flex:1;border:none;background:#ece1cd;border-radius:12px;
    padding:12px 0;font-size:18px;font-weight:600;color:#6b5a4c;
    cursor:pointer;min-height:44px;font-family:inherit;
    transition:all .2s ease;
  }
  .mode-switch button:hover{transform:scale(1.02);}
  .mode-switch button:active{transform:scale(.98);}
  .mode-switch button.active{
    background:var(--accent-deep);color:#fff;font-weight:700;
    box-shadow:0 2px 8px rgba(242,112,46,.25);
  }
  .mode-switch button.active.mode-yue{background:var(--yue);}
  .mode-switch button.active.mode-cheng{background:var(--cheng);}

  /* ===== 通用卡片 ===== */
  section{margin-bottom:26px;}
  .sec-title{
    font-size:21px;font-weight:700;margin:0 0 12px;
    display:flex;align-items:center;gap:8px;
  }
  .card{
    background:var(--card);border-radius:20px;padding:16px 18px;
    box-shadow:0 3px 12px rgba(120,90,40,.07);
    border:1px solid var(--line);
  }
  /* 待办区有待处理留言时高亮 */
  .card.todo-highlight{
    border:2px solid #FF9800;
    background:#FFF3E0;
  }

  /* ===== 3. 待办区 ===== */
  .empty{
    color:var(--ink-soft);text-align:center;padding:14px 8px;font-size:18px;
  }
  .todo-item{
    display:flex;align-items:flex-start;gap:10px;
    padding:12px 0;border-bottom:1px dashed var(--line);
  }
  .todo-item:last-child{border-bottom:none;padding-bottom:4px;}
  .todo-badge{
    flex-shrink:0;font-size:14px;font-weight:700;color:#fff;
    border-radius:8px;padding:2px 10px;margin-top:4px;
  }
  .todo-badge.yue{background:var(--yue);}
  .todo-badge.cheng{background:var(--cheng);}
  .todo-item .txt{flex:1;word-break:break-word;}
  .todo-item .meta{font-size:15px;color:var(--ink-soft);}
  .todo-done{color:var(--ink-soft);text-decoration:line-through;}

  /* ===== 4. 四大入口区 ===== */
  .entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .entry-card{
    background:var(--card);border-radius:20px;border:1px solid var(--line);
    box-shadow:0 3px 12px rgba(120,90,40,.07);
    padding:22px 16px;text-align:center;text-decoration:none;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    min-height:130px;justify-content:center;
    transition:transform .2s ease, background-color .2s ease, box-shadow .2s ease;
    cursor:pointer;font-family:inherit;
  }
  .entry-card:hover{
    transform:scale(1.02);background:#fbf4e8;
    box-shadow:0 6px 18px rgba(120,90,40,.13);
  }
  .entry-card:active{transform:scale(.98);}
  .entry-card .icon{font-size:40px;line-height:1;}
  .entry-card .name{font-size:19px;font-weight:700;}
  .entry-card .desc{font-size:15px;color:var(--ink-soft);line-height:1.6;}
  /* 一起看模式下表单入口置灰不可点 */
  .entry-card.disabled{opacity:.5;filter:grayscale(.35);cursor:not-allowed;box-shadow:none;}
  .entry-card.disabled:hover{transform:none;background:var(--card);box-shadow:none;}
  .entry-card.disabled .desc{color:#b98a4e;font-size:14px;}

  /* 单孩模式：卡片按孩子着色（暖/冷） */
  .entry-card.kid-yue{border-color:#f3c9e2;}
  .entry-card.kid-yue:hover{background:#fdf2f8;}
  .entry-card.kid-cheng{border-color:#cfe4fb;}
  .entry-card.kid-cheng:hover{background:#eff5ff;}

  /* 一起看模式：两个孩子各一列 */
  .entry-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px;}
  .entry-col{display:flex;flex-direction:column;gap:12px;}
  .entry-col-title{
    font-size:17px;font-weight:700;text-align:center;
    padding:8px 0;border-radius:12px;margin-bottom:2px;
  }
  .entry-col-title.yue{color:#d56fae;background:#fdf2f8;}
  .entry-col-title.cheng{color:#2f86e6;background:#eff5ff;}

  /* ===== 每日英语固定卡片 ===== */
  .english-card{
    background:linear-gradient(135deg,#eef6ff,#eafff4);
    border-radius:20px;border:1px solid var(--line);
    box-shadow:0 3px 12px rgba(120,90,40,.07);
    padding:16px 18px;margin-top:16px;
  }
  .english-card[hidden]{display:none;}
  section > .english-card:first-child{margin-top:0;}
  .english-title{font-size:21px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .eng-block{padding:10px 0;}
  .eng-block + .eng-block{border-top:1px dashed var(--line);}
  .eng-word-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .eng-type{font-size:13px;font-weight:700;background:var(--accent);color:#fff;padding:3px 8px;border-radius:999px;vertical-align:middle;}
  .eng-word{font-size:26px;font-weight:700;color:var(--ink);}
  .eng-phon{font-size:16px;color:var(--ink-soft);}
  .eng-zh{font-size:18px;color:var(--ink);margin-top:4px;}
  .eng-sentence{font-size:17px;color:var(--ink);margin-top:6px;line-height:1.7;}
  .eng-sentence .cn{color:var(--ink-soft);font-size:15px;}
  /* 手机上点单词 / 点英文句子都能朗读（目标更大，孩子好按） */
  .eng-word,.eng-sentence{cursor:pointer;-webkit-tap-highlight-color:rgba(232,122,60,.18);}
  .eng-word:active,.eng-sentence:active{opacity:.6;}
  .speak-btn{
    border:none;cursor:pointer;font-family:inherit;
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:#ffe9d6;color:#e0651f;font-size:15px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 4px rgba(224,101,31,.18);
    transition:transform .15s ease, background-color .15s ease;
  }
  .speak-btn:hover{transform:scale(1.05);}
  .speak-btn:active{transform:scale(.92);background:#ffd9bd;}
  .speak-btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
  .speak-btn:disabled:hover{transform:none;}
  /* 朗读中：按钮高亮 + 呼吸光圈，让孩子知道"正在读" */
  .speak-btn.is-playing{background:#ffc59b;animation:spPulse 1.1s ease-in-out infinite;}
  @keyframes spPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(232,122,60,.50);}
    50%    {box-shadow:0 0 0 9px rgba(232,122,60,0);}
  }
  /* 用在线发音兜底时，右上角一个小圆点提示 */
  .speak-btn.is-net::after{
    content:'';position:absolute;top:6px;right:6px;
    width:8px;height:8px;border-radius:50%;background:#4a9d5f;
  }
  .speak-btn{position:relative;}
  /* 底部轻提示（不打断阅读） */
  .speak-tip{
    position:fixed;left:50%;bottom:26px;z-index:99;
    transform:translateX(-50%) translateY(14px);
    background:rgba(74,59,50,.94);color:#fff;
    padding:11px 18px;border-radius:999px;font-size:15px;line-height:1.5;
    max-width:88vw;text-align:center;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .speak-tip.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===== 往日回顾 按钮 + 弹层 ===== */
  .card-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .card-title-row .english-title{margin:0;}
  .card-title-row .sec-title{margin:0;}
  .today-title{font-size:21px;font-weight:700;color:var(--ink);}
  .review-btn{
    border:1px solid var(--line);background:var(--page);color:var(--ink-soft);
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    padding:4px 11px;border-radius:999px;flex-shrink:0;
    transition:background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .review-btn:hover{background:#fff;border-color:var(--accent);color:var(--accent-deep);}
  .review-btn:active{transform:scale(.95);}

  .review-mask{
    position:fixed;inset:0;z-index:200;display:none;
    background:rgba(60,45,35,.42);backdrop-filter:blur(2px);
    align-items:flex-end;justify-content:center;
  }
  .review-mask.show{display:flex;animation:rmFade .2s ease;}
  @keyframes rmFade{from{opacity:0;}to{opacity:1;}}
  .review-sheet{
    width:100%;max-width:680px;min-height:200px;max-height:82vh;
    display:flex;flex-direction:column;
    background:var(--page);border-radius:22px 22px 0 0;overflow:hidden;
    box-shadow:0 -8px 30px rgba(0,0,0,.18);
  }
  .review-head{
    position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:16px 18px;background:linear-gradient(180deg,#fff,var(--page));
    border-bottom:1px solid var(--line);
  }
  .review-head h3{margin:0;font-size:18px;color:var(--ink);}
  .review-close{
    border:none;background:#efe3d2;color:var(--ink-soft);font-size:20px;line-height:1;
    width:34px;height:34px;border-radius:50%;cursor:pointer;flex-shrink:0;
  }
  .review-close:active{transform:scale(.92);}
  .review-body{padding:6px 18px 26px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:0 1 auto;min-height:0;}
  .review-week{margin-top:14px;}
  .review-week-title{
    font-size:14px;font-weight:700;color:var(--accent-deep);
    background:#fff4ea;display:inline-block;padding:3px 12px;border-radius:999px;margin-bottom:8px;
  }
  .review-item{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 13px;margin-bottom:10px;
  }
  .review-item + .review-item{margin-top:0;}
  .review-item-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .review-day{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .review-type{
    font-size:12px;font-weight:700;color:#fff;background:var(--accent);
    padding:2px 8px;border-radius:999px;
  }
  .review-text{font-size:18px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .review-phon{font-size:14px;color:var(--ink-soft);font-weight:400;}
  .review-zh{font-size:15px;color:var(--ink);margin-top:3px;}
  .review-cn{font-size:14px;color:var(--ink-soft);margin-top:2px;line-height:1.6;}
  .review-ex{font-size:14px;color:var(--ink-soft);margin-top:3px;line-height:1.6;}
  .review-speak{width:30px;height:30px;font-size:13px;margin-left:auto;}
  .review-ts-main{font-size:18px;font-weight:600;line-height:1.85;color:var(--ink);}
  .review-ts-extra{font-size:15px;color:var(--ink-soft);margin-top:4px;line-height:1.7;}
  .review-kid{font-size:13px;font-weight:700;color:#fff;border-radius:8px;padding:1px 10px;flex-shrink:0;}
  .review-kid.yue{background:var(--yue);}
  .review-kid.cheng{background:var(--cheng);}
  .review-empty{text-align:center;color:var(--ink-soft);padding:14px 0;}
  /* 今日一句话回顾 · 搜索条（仅 sentence 回顾显示，置于标题下、滚动内容外） */
  .sen-search-wrap{
    display:flex;align-items:center;gap:8px;flex-shrink:0;
    margin:0 18px 8px;padding:4px 12px 4px 10px;
    background:var(--card);border:1px solid var(--line);border-radius:999px;
  }
  .sen-search-wrap[hidden]{display:none;}
  .sen-search-ic{color:var(--ink-soft);flex-shrink:0;}
  .sen-search-input{
    flex:1;border:none;background:transparent;outline:none;
    font-family:inherit;font-size:16px;color:var(--ink);
    padding:10px 0;min-height:20px;-webkit-appearance:none;
  }
  .sen-search-input::-webkit-search-cancel-button{display:none;}
  .sen-search-clear{
    border:none;background:#f0e6d6;color:var(--ink-soft);cursor:pointer;
    width:26px;height:26px;border-radius:50%;font-size:16px;line-height:1;flex-shrink:0;
  }
  .sen-search-clear[hidden]{display:none;}
  /* 今日一句话回顾 · 主题筛选条 */
  .review-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .rf-chip{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-size:14px;font-family:inherit;padding:5px 10px;border-radius:999px;cursor:pointer;min-height:32px;
  }
  .rf-chip.on{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep);}
  .rf-chip:active{transform:scale(.95);}
  /* 共学主题 · 往日回顾里的周次卡片 */
  .review-history-item{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:10px;text-decoration:none;color:var(--ink);
    transition:transform .15s ease, background-color .15s ease;
  }
  .review-history-item:hover{background:#fffbf6;}
  .review-history-item:active{transform:scale(.98);}
  .review-history-item .rh-num{
    flex-shrink:0;width:46px;height:46px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;line-height:1.1;text-align:center;
  }
  .review-history-item .rh-main{flex:1;min-width:0;}
  .review-history-item .rh-title{font-size:17px;font-weight:700;}
  .review-history-item .rh-desc{font-size:14px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}
  .review-history-item .rh-go{font-size:20px;color:var(--ink-soft);flex-shrink:0;}

  /* ===== 今日一句话 + 每日打卡 ===== */
  .today-card{
    background:var(--card);border-radius:20px;border:1px solid var(--line);
    box-shadow:0 3px 12px rgba(120,90,40,.07);
    padding:16px 18px;margin-top:16px;
  }
  section > .today-card:first-child{margin-top:0;}
  .today-date{
    text-align:center;color:var(--ink-soft);font-size:15px;
    padding-bottom:10px;border-bottom:1px dashed var(--line);margin-bottom:12px;
  }
  .ts-card{
    cursor:pointer;border-radius:14px;padding:12px 14px;
    transition:transform .2s ease, background-color .2s ease;
  }
  .ts-card + .ts-card{margin-top:10px;}
  .ts-card:hover{transform:scale(1.02);background:#fbf4e8;}
  .ts-card:active{transform:scale(.98);}
  .ts-label{font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
  .kid-chip{
    font-size:14px;font-weight:700;color:#fff;border-radius:8px;padding:1px 10px;flex-shrink:0;
  }
  .kid-chip.yue{background:var(--yue);}
  .kid-chip.cheng{background:var(--cheng);}
  .ts-main{font-size:19px;font-weight:600;line-height:1.8;margin-top:6px;}
  .ts-main .phon{color:var(--ink-soft);font-size:16px;font-weight:400;}
  .ts-extra{
    border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;
    font-size:16px;line-height:1.8;color:var(--ink);font-weight:400;
  }
  .ts-extra[hidden]{display:none;}
  .ts-extra p{margin:4px 0;}
  .ts-hint{font-size:13px;color:var(--ink-soft);text-align:right;margin-top:4px;}
  .check-row{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .check-group{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .ck-kid{
    font-size:14px;font-weight:700;color:#fff;border-radius:8px;
    padding:3px 10px;flex-shrink:0;
  }
  .ck-kid.yue{background:var(--yue);}
  .ck-kid.cheng{background:var(--cheng);}
  .check-item{
    flex:1;min-width:150px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;
    border:2px solid var(--line);border-radius:14px;padding:12px 14px;
    cursor:pointer;font-size:18px;font-weight:600;min-height:52px;
    transition:all .2s ease;background:#fff;
  }
  .check-item:hover{transform:scale(1.02);}
  .check-item:active{transform:scale(.98);}
  .check-item .ck-box{width:24px;height:24px;flex-shrink:0;cursor:pointer;accent-color:#43a047;}
  .check-item.done{border-color:#66bb6a;background:#e8f5e9;color:#2e7d32;}

  /* ===== 阅读记录（升级版：书名/时长/评分/已读清单） ===== */
  .readlog{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;}
  .readlog-block + .readlog-block{margin-top:16px;}
  .readlog-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .readlog-head .rl-kid{font-size:14px;font-weight:700;color:#fff;border-radius:8px;padding:1px 10px;}
  .readlog-head .rl-kid.yue{background:var(--yue);}
  .readlog-head .rl-kid.cheng{background:var(--cheng);}
  .readlog-head .rl-title{font-size:18px;font-weight:700;color:var(--ink);}
  .readlog-summary{font-size:15px;color:var(--ink-soft);margin-bottom:10px;line-height:1.6;}
  .readlog-summary b{color:var(--accent-deep);}
  .readlog-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fffdf8;border:1px solid var(--line);border-radius:14px;padding:10px 12px;}
  .readlog-input{flex:1 1 140px;min-width:120px;padding:9px 12px;font-size:16px;font-family:inherit;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);}
  .readlog-input:focus{outline:none;border-color:#ffb27a;}
  .readlog-min{width:88px;padding:9px 10px;font-size:16px;font-family:inherit;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-align:center;}
  .readlog-stars{display:flex;gap:2px;}
  .readlog-star{border:none;background:none;font-size:24px;line-height:1;cursor:pointer;color:#e0c9a6;padding:2px;min-width:32px;min-height:32px;}
  .readlog-star.on{color:#f6a623;}
  .readlog-add{border:none;background:var(--accent-deep);color:#fff;font-size:16px;font-weight:700;font-family:inherit;padding:9px 18px;border-radius:12px;cursor:pointer;min-height:44px;}
  .readlog-add:active{transform:scale(.97);}
  .readlog-list{margin-top:12px;display:flex;flex-direction:column;gap:10px;}
  .readlog-item{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;}
  .readlog-item .ri-main{flex:1;min-width:0;}
  .readlog-item .ri-title{font-size:17px;font-weight:700;line-height:1.5;}
  .readlog-item .ri-meta{font-size:14px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}
  .readlog-item .ri-stars{color:#f6a623;font-size:15px;letter-spacing:1px;}
  .readlog-item .ri-note{font-size:14px;color:var(--ink-soft);margin-top:3px;line-height:1.6;}
  .readlog-item .ri-date{font-size:12px;color:#b6a690;margin-top:3px;}
  .readlog-del{border:none;background:none;color:#c98;font-size:20px;cursor:pointer;padding:2px 6px;min-width:36px;min-height:36px;align-self:flex-start;}
  .readlog-empty{font-size:14px;color:var(--ink-soft);padding:6px 2px;}

  /* 连续打卡天数提示（位于打卡区上方） */
  #streakArea{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .week-summary{display:flex;gap:10px;margin-top:12px;padding:10px 12px;background:var(--yue-bg);border-radius:12px;flex-wrap:wrap;justify-content:center;}
  .week-summary .ws-item{text-align:center;flex:1;min-width:70px;}
  .week-summary .ws-num{font-size:22px;font-weight:700;color:var(--accent-deep);}
  .week-summary .ws-label{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .week-summary .ws-title{width:100%;text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:4px;}
  .streak-line{
    display:flex;align-items:center;gap:10px;
    background:#fff7ec;border:1px solid #ffe2bd;border-radius:14px;
    padding:10px 14px;font-size:17px;line-height:1.6;
  }
  .streak-line.yue{background:#fff1f5;border-color:#f7d4e4;}
  .streak-line.cheng{background:#eef6ff;border-color:#d4e6fb;}
  .streak-line .streak-text{flex:1;word-break:break-word;}
  .streak-line .streak-text b{color:var(--accent-deep);font-size:20px;}

  /* 家长回复（待处理留言下方） */
  .reply-line{
    margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);
    font-size:15px;color:#9c8b7d;line-height:1.7;
  }

  /* ===== 5. 给爸妈的提示条 ===== */
  .parent-tip{
    border:2px dashed #d8c5a5;border-radius:14px;
    background:#fbf3e2;color:#9c8b7d;
    font-size:15px;line-height:1.8;padding:10px 16px;margin-top:16px;
  }
  .parent-tip[hidden]{display:none;}

  /* ===== 6. 本周共学 ===== */
  .week-current{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border-radius:20px;border:1px solid var(--line);
    box-shadow:0 3px 12px rgba(120,90,40,.07);
    padding:20px 18px;cursor:pointer;text-decoration:none;color:var(--ink);
    transition:transform .2s ease, background-color .2s ease, box-shadow .2s ease;
  }
  .week-current:hover{
    transform:scale(1.02);background:#fbf4e8;
    box-shadow:0 6px 18px rgba(120,90,40,.13);
  }
  .week-current:active{transform:scale(.98);}
  .week-current .book{font-size:36px;line-height:1;}
  .week-current .wt{font-size:20px;font-weight:700;}
  .week-current .wd{font-size:15px;color:var(--ink-soft);}
  .week-current .arrow{margin-left:auto;font-size:22px;color:var(--accent);}

  /* ===== 7. 历史周次 ===== */
  .week-history{display:flex;flex-direction:column;gap:10px;}
  .week-mini{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border-radius:14px;border:1px solid var(--line);
    padding:12px 16px;text-decoration:none;color:var(--ink);
    transition:transform .2s ease, background-color .2s ease;
  }
  .week-mini:hover{transform:scale(1.02);background:#fbf4e8;}
  .week-mini:active{transform:scale(.98);}
  .week-mini .num{
    flex-shrink:0;width:44px;height:44px;border-radius:12px;
    background:var(--cheng-bg);color:#c07d16;font-weight:700;
    display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  .week-mini .t{flex:1;font-size:18px;font-weight:600;}
  .week-mini .go{color:var(--accent);font-size:18px;}

  /* ===== 8. 视频分享 ===== */
  .video-list{display:flex;flex-direction:column;gap:12px;}
  .video-btn{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border-radius:16px;border:1px solid var(--line);
    box-shadow:0 3px 12px rgba(120,90,40,.07);
    padding:16px 18px;text-decoration:none;color:var(--ink);
    transition:transform .2s ease, background-color .2s ease;
  }
  .video-btn:hover{transform:scale(1.02);background:#fbf4e8;}
  .video-btn:active{transform:scale(.98);}
  .video-btn .play{
    flex-shrink:0;width:52px;height:52px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--gold));
    display:flex;align-items:center;justify-content:center;
  }
  .video-btn .play svg{width:22px;height:22px;fill:#fff;margin-left:3px;}
  .video-btn .vt{font-size:18px;font-weight:700;line-height:1.5;}
  .video-btn .vd{font-size:15px;color:var(--ink-soft);}
  /* 视频打不开时的兜底提示 */
  .vf-tip{
    display:flex;align-items:center;gap:10px;margin-top:12px;
    background:#fff6e8;border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;font-size:15px;line-height:1.6;color:var(--ink);
  }
  .vf-tip[hidden]{display:none;}
  .vf-text{flex:1;}
  .vf-open{
    flex-shrink:0;border:0;border-radius:999px;cursor:pointer;
    background:var(--accent);color:#fff;font-size:15px;font-weight:700;
    padding:10px 16px;min-height:44px;font-family:inherit;
  }
  .vf-open:active{background:var(--accent-deep);}
  .vf-close{
    flex-shrink:0;border:0;background:transparent;cursor:pointer;
    font-size:24px;line-height:1;color:var(--ink-soft);
    width:44px;height:44px;font-family:inherit;
  }
  /* 嵌入式播放器（B站/YouTube） */

  /* ===== 9. 底部 ===== */
  footer{
    text-align:center;margin-top:34px;padding-top:22px;
    border-top:1px solid var(--line);color:var(--ink-soft);
  }
  footer .encourage{
    color:var(--ink-soft);font-size:16px;margin-bottom:8px;line-height:1.8;
  }
  footer .copy{font-size:15px;line-height:1.8;}
  /* 底部成长数据导出/导入按钮行 */
  footer .tools-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px;}
  footer .tool-btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-size:15px;font-family:inherit;padding:9px 16px;border-radius:12px;cursor:pointer;min-height:44px;
  }
  .tool-btn.highlight{border-color:var(--accent);background:var(--yue-bg);font-weight:600;}
  footer .tool-btn:active{transform:scale(.97);}

  /* ===== 按模式切换整体色调 ===== */
  body[data-mode="all"]{ --page:#fdf6ea; --accent:#ff8a4c; --accent-deep:#f2702e; --gold:#ffc94d; }
  body[data-mode="yueyue"]{ --page:#fdf2f8; --accent:#e58fc0; --accent-deep:#d56fae; --gold:#f4c6e4; }
  body[data-mode="chengcheng"]{ --page:#eff5ff; --accent:#4ea1f3; --accent-deep:#2f86e6; --gold:#bfe0ff; }

  /* ===== 首次打开身份选择遮罩 ===== */
  .welcome-mask{
    position:fixed;inset:0;z-index:1000;display:flex;
    align-items:center;justify-content:center;padding:20px;
    background:rgba(70,50,40,.55);
  }
  .welcome-mask[hidden]{display:none;}
  .welcome-card{
    background:#fff;border-radius:24px;padding:30px 24px;
    max-width:520px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .welcome-card h2{font-size:24px;margin:0 0 20px;line-height:1.6;}
  .welcome-btns{display:flex;gap:16px;}
  .welcome-btn{
    flex:1;min-height:160px;border:none;border-radius:20px;cursor:pointer;
    color:#fff;font-family:inherit;font-size:22px;font-weight:700;line-height:1.5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:16px;transition:transform .15s ease, box-shadow .15s ease;
  }
  .welcome-btn span{font-size:16px;font-weight:600;opacity:.9;}
  .welcome-btn:hover{transform:scale(1.03);box-shadow:0 8px 20px rgba(0,0,0,.18);}
  .welcome-btn:active{transform:scale(.98);}
  .welcome-btn.yue{background:linear-gradient(135deg,#f4a6d0,#e07cb4);}
  .welcome-btn.cheng{background:linear-gradient(135deg,#6fb6f5,#3d8fe0);}
  .welcome-tip{color:#9c8b7d;font-size:15px;margin:18px 0 0;}
  @media(max-width:480px){
    .welcome-btns{gap:10px;}
    .welcome-btn{min-height:140px;font-size:20px;}
  }

  /* ===== 周六共读提示条 ===== */
  .saturday-hint{
    display:flex;align-items:center;gap:10px;
    background:#fff4e0;border:2px solid #ffd28a;border-radius:14px;
    padding:10px 14px;margin:14px 0 0;font-size:16px;color:#9a6a2e;
  }
  .saturday-hint[hidden]{display:none;}
  .saturday-hint .sh-text{flex:1;line-height:1.6;}
  .saturday-hint .sh-go{
    border:none;background:var(--accent-deep);color:#fff;font-family:inherit;
    font-size:16px;font-weight:700;border-radius:10px;padding:8px 14px;
    cursor:pointer;min-height:40px;white-space:nowrap;transition:transform .15s ease;
  }
  .saturday-hint .sh-go:active{transform:scale(.96);}
  .saturday-hint .sh-close{
    border:none;background:transparent;color:#9a6a2e;font-size:22px;
    cursor:pointer;line-height:1;padding:0 4px;
  }

  /* ===== 家长重置身份按钮 ===== */
  .reset-btn{
    display:inline-block;margin-top:6px;background:none;border:none;
    color:#bcae9e;font-size:13px;font-family:inherit;cursor:pointer;text-decoration:underline;
  }
  .reset-btn:hover{color:#9c8b7d;}

  /* ===== 模式内容可见性（JS 控制 data-owner 元素） ===== */
  .hidden-by-mode{display:none !important;}

  @media (max-width:480px){
    header h1{font-size:27px;}
    .entry-grid{gap:10px;}
    .entry-cols{gap:10px;}
  }

  /* ===== 入口卡全模式统一紧凑小格（图标+短名，去 desc）——覆盖上方 .entry-card 基础值 ===== */
  .entry-card{
    padding:12px 8px;border-radius:16px;gap:4px;min-height:64px;
  }
  .entry-card .icon{font-size:24px;line-height:1;}
  .entry-card .name{
    font-size:15px;font-weight:700;line-height:1.25;
    max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .entry-card .desc{display:none;}   /* 去掉说明行（含"请切换孩子模式填写表单"） */
  .entry-grid{gap:10px;}            /* 单孩 4 格：2×2（.entry-grid 已是 2 列） */
  /* 一起看每孩 4 格也 2×2：列标题独占整行 */
  .entry-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .entry-col-title{grid-column:1 / -1;font-size:15px;padding:6px 0;}
  /* 一起看 disabled：浅灰不可点、稍提透明度避免太淡看不清 */
  .entry-card.disabled{opacity:.72;filter:grayscale(.25);}
  .entry-card.disabled:focus{outline:none;}
  /* 提示条：仅一起看(body[data-mode="all"])显示，零 JS */
  #entryTip{display:none;}
  body[data-mode="all"] #entryTip{display:block;}
  .entry-tip{
    background:#fff7e3;border:1px dashed #e3c06a;border-radius:12px;
    color:#8a6a2e;font-size:14px;line-height:1.5;padding:8px 12px;margin-bottom:12px;
  }
  /* 窄屏：一起看两娃上下排，防 4 列挤爆/名字截断 */
  @media (max-width:520px){ .entry-cols{grid-template-columns:1fr;} }

  /* ===== 响应式系统加固：防横向溢出 + 多尺寸适配（340 手机 / 平板） ===== */
  img,svg,video,canvas{max-width:100%;height:auto;}
  .ts-main,.ts-extra,.review-ts-main,.review-ts-extra,.eng-zh,.eng-sentence{
    overflow-wrap:break-word;word-break:break-word;
  }
  .rf-chip{white-space:nowrap;}
  /* 日期查看器：点📅日期条展开，可选日期 + 玥玥/程程切换看对应一句话 */
  .today-date{cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .today-date:hover{color:var(--ink);}
  .ts-date-pick{border:none;background:transparent;font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;padding:2px 4px;}
  .ts-kid-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:14px;padding:6px 14px;border-radius:999px;cursor:pointer;min-height:36px;}
  .ts-kid-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
  .ts-kid-btn.yue-btn.on{background:var(--yue);border-color:var(--yue);}
  .ts-kid-btn.cheng-btn.on{background:var(--cheng);border-color:var(--cheng);}
  .ts-date-reset{border:none;background:transparent;color:var(--accent);font-family:inherit;font-size:14px;cursor:pointer;text-decoration:underline;padding:6px 8px;min-height:36px;}

  @media (max-width:360px){
    body{padding:10px;}
    h1{font-size:23px;} .site-sub{font-size:16px;}
    .mode-switch button{font-size:15px;padding:8px 4px;}
    .card,.today-card,.english-card{padding:14px 12px;}
    .sec-title{font-size:19px;}
    .entry-card .icon{font-size:22px;}
    .entry-card .name{font-size:14px;}
    .ts-main{font-size:17px;}
    .check-item{min-width:120px;font-size:16px;}
    .welcome-card h2{font-size:20px;} .welcome-btn span{font-size:15px;}
    footer .tool-btn{font-size:13px;padding:8px 6px;}
  .tool-btn.highlight{border-color:var(--accent);background:var(--yue-bg);font-weight:600;}
    .review-head{padding:14px 12px;} .review-body{padding:6px 12px 22px;}
    .rf-chip{font-size:13px;padding:4px 8px;}
  }
  @media (max-width:480px){
    .saturday-hint{flex-wrap:wrap;}
    .saturday-hint .sh-text{width:100%;}
    .saturday-hint .sh-go{margin-left:auto;}
  }
  @media (min-width:768px){
    .review-mask{align-items:center;padding:40px 16px;}
    .review-sheet{border-radius:22px;max-height:84vh;}
    .welcome-card{padding:36px 30px;}
  }
</style>
</head>
<body>
<!-- 朗读用音频元素：提前放在 DOM 里，手机浏览器第一次点击就能出声 -->
<audio id="tts-audio" preload="auto" playsinline webkit-playsinline x5-playsinline style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"></audio>
<div class="page">

  <!-- 1. 顶部标题 -->
  <header>
    <div class="date-weather" id="dateWeather"></div>
    <h1 id="siteTitle">🏡 玥玥和程程的学习小屋</h1>
    <p class="sub" id="siteSub">六年级 · 五年级 | 一起长大，一起学本领</p>
  </header>

  <!-- 周六共读提示条 -->
  <div class="saturday-hint" id="saturdayHint" hidden>
    <span class="sh-text" id="shText"></span>
    <button type="button" class="sh-go" id="shGo">切换到共读</button>
    <button type="button" class="sh-close" id="shClose" aria-label="关闭">×</button>
  </div>

  <!-- 3. 每日英语（固定模块，位于今日一句话上方） -->
  <section>
    <div class="english-card" id="englishCard">
      <div class="card-title-row">
        <div class="english-title">每日英语</div>
        <button type="button" class="review-btn" id="reviewEnglish">往日回顾</button>
      </div>
      <div id="englishBody"></div>
    </div>
  </section>

  <!-- 4. 今日一句话 + 每日打卡 -->
  <section>
    <div class="today-card" id="todayCard">
      <div class="card-title-row">
        <div class="today-title">今日一句话</div>
        <button type="button" class="review-btn" id="reviewSentence">往日回顾</button>
      </div>
      <div class="today-date" id="todayDate"></div>
      <div id="datePickerRow" hidden style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:-2px 0 10px;">
        <input type="date" id="datePick" class="ts-date-pick" aria-label="选择要查看的日期">
        <button type="button" id="dpKidYue" class="ts-kid-btn yue-btn">玥玥</button>
        <button type="button" id="dpKidCheng" class="ts-kid-btn cheng-btn">程程</button>
        <button type="button" id="datePickReset" class="ts-date-reset" hidden>回到今天</button>
      </div>
      <div id="sentenceCards"></div>
      <div id="streakArea"></div>
      <div class="week-summary" id="weekSummary"></div>
      <div class="check-row" id="checkRow"></div>
      <div class="readlog" id="readLogArea"></div>
    </div>
  </section>

  <!-- 5. 待办区：爸妈要回复的事 -->
  <section>
    <h2 class="sec-title">📌 爸妈要回复的事</h2>
    <div class="card" id="todoCard">
      <div class="empty" id="todoEmpty">暂时没有待回复的事~</div>
      <div id="todoList"></div>
    </div>
  </section>

  <!-- 6. 四大入口区（按模式动态渲染：单孩 4 个 / 一起看 8 个分两列） -->
  <section>
    <h2 class="sec-title">✏️ 我要做的事</h2>
    <div class="entry-tip" id="entryTip">💡 切到下方「玥玥」或「程程」就能点开填写；「一起看」只展示清单</div>
    <div id="entryArea"></div>
  </section>

  <!-- 7. 本周共学 -->
  <section>
    <div class="card-title-row">
      <h2 class="sec-title">📖 本周共学</h2>
      <button type="button" class="review-btn" id="reviewHistory">往日回顾</button>
    </div>
    <div id="currentWeek"></div>
  </section>

  <!-- 8. 视频分享区 -->
  <section>
    <h2 class="sec-title">🎬 最近分享</h2>
    <div class="video-list" id="videoList">
      <div class="empty">爸妈看到好视频会分享到这里~</div>
    </div>
    <div class="vf-tip" id="videoFallback" hidden>
      <div class="vf-text">视频好像没打开～手机可能拦住了新窗口。<br>点右边的按钮直接打开，或者用右上角菜单「在浏览器打开」。</div>
      <button class="vf-open" id="vfOpen" type="button">直接打开</button>
      <button class="vf-close" id="vfClose" type="button" aria-label="关闭提示">×</button>
    </div>
  </section>

  <!-- 10. 底部 -->
  <footer>
    <div class="mode-switch" id="modeSwitch">
      <button type="button" data-mode="all" class="active">一起看</button>
      <button type="button" data-mode="yueyue" class="mode-yue">玥玥模式</button>
      <button type="button" data-mode="chengcheng" class="mode-cheng">程程模式</button>
    </div>
    <div class="encourage" id="encourage"></div>
    <div class="copy" id="footerCopy">玥玥和程程的学习小屋 · 2026秋季学期</div>
    <div class="tools-row">
      <button type="button" class="tool-btn" id="exportAll">📦 全部导出</button>
      <button type="button" class="tool-btn" id="exportYue">👧 导出玥玥</button>
      <button type="button" class="tool-btn" id="exportCheng">👦 导出程程</button>
      <button type="button" class="tool-btn" id="importData">📥 导入数据</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </footer>

</div>

  <!-- 首次打开身份选择遮罩 -->
  <div class="welcome-mask" id="welcomeMask" hidden>
    <div class="welcome-card">
      <h2>欢迎来到学习小屋！🏡<br>你是谁呀？</h2>
      <div class="welcome-btns">
        <button type="button" class="welcome-btn yue" data-user="yueyue">👧<br>我是玥玥<br><span id="welcomeGradeYue">六年级</span></button>
        <button type="button" class="welcome-btn cheng" data-user="chengcheng">👦<br>我是程程<br><span id="welcomeGradeCheng">五年级</span></button>
      </div>
      <p class="welcome-tip">选一次就好，以后会自动记住哦~</p>
    </div>
  </div>

  <!-- 往日回顾 弹层 -->
  <div class="review-mask" id="reviewMask" hidden>

      <div class="review-head">
        <h3 id="reviewTitle">往日回顾</h3>
        <button type="button" class="review-close" id="reviewClose" aria-label="关闭">×</button>
      </div>
      <div class="sen-search-wrap" id="senSearchWrap" hidden>

  function weatherCodeToText(code){

    if(code === 0) return '晴';
    if(code === 1) return '晴间多云';
    if(code === 2) return '多云';
    if(code === 3) return '阴';
    if(code >= 45 && code <= 48) return '雾';
    if(code >= 51 && code <= 57) return '毛毛雨';
    if(code >= 61 && code <= 67) return '小雨';
    if(code >= 71 && code <= 77) return '雪';
    if(code >= 80 && code <= 82) return '阵雨';
    if(code >= 85 && code <= 86) return '阵雪';
    if(code >= 95) return '雷阵雨';
    return '多云';
  }

      var d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
      el.textContent = '📅 ' + (d.getMonth()+1) + '月' + d.getDate() + '日 · ' + wn[d.getDay()] + ' · 查看历史 ▾';
    }else{

  /* 排期查找：返回 {week, item} 给某孩某日期；无对应周则钳制到最近周 */
  function sentLookup(kid, dateS){
    if(!SENT_SCHED.length) return null;
    var pick = null;
    for(var i = 0; i < SENT_SCHED.length; i++){
      if(dateS >= SENT_SCHED[i].start && dateS <= SENT_SCHED[i].end){ pick = SENT_SCHED[i]; break; }
    }
    if(!pick) pick = (dateS < SENT_SCHED[0].start) ? SENT_SCHED[0] : SENT_SCHED[SENT_SCHED.length - 1];
    var item = (pick[kid] && pick[kid][dateS]) ? pick[kid][dateS] : null;
    return { week: pick, item: item };
  }

  /* 确定性字符串哈希：保证当天回退结果稳定不随刷新跳变 */
  function hashStr(s){
    var h = 0;
    for(var i = 0; i < s.length; i++){ h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }

  /* 兜底池哨兵：排除任何"今天周末/玩得开心"占位模板，保证空档(含周末)兜底只给真话 */
  function isWeekendTmp(m){ return /^<b>今天周末|今天周末，|玩得开心！/.test(m || ''); }

  /* 无排期条目时的兜底：从历史排期(该孩所有已排真话)取一条当天稳定的，绝不显示"爸妈正在准备"或"周末占位" */
  function sentFallback(kid, dateS){
    var pool = [];
    SENT_SCHED.forEach(function(wk){
      var per = wk[kid] || {};
      Object.keys(per).forEach(function(d){
        var it = per[d];
        if(it && it.main && !isWeekendTmp(it.main)) pool.push(it);
      });
    });
    if(!pool.length) return null;
    var idx = hashStr(dateS + '_' + kid) % pool.length;
    var it = pool[idx];
    return { main: it.main, extra: it.extra, topic: it.topic || '', fallback: true };
  }

  /* 连续打卡天数：从今天往前数连续完成的天数（今天未打卡则从昨天起算） */
  function calcStreak(kid, kind){
    var streak = 0;
    var d = new Date();
    if(isDoneOn(kid, kind, dateStr(d))){
      streak = 1;
      d.setDate(d.getDate() - 1);
      while(isDoneOn(kid, kind, dateStr(d))){ streak++; d.setDate(d.getDate() - 1); }
    }else{
      d.setDate(d.getDate() - 1);
      while(isDoneOn(kid, kind, dateStr(d))){ streak++; d.setDate(d.getDate() - 1); }
    }
    return streak;
  }

  /* ============================================================
   * 朗读引擎（手机 / 平板 / 微信内置浏览器 通用）
   * 三级保障：
   *   ① 浏览器原生 speechSynthesis（离线可用）
   *   ② 在线发音音频兜底（原生没声音 / 微信内核不支持时自动切换）
   *   ③ 都失败 → 底部轻提示 + 把音标放大，孩子可以照着读
   * 针对手机的三个坑：
   *   · iOS 必须在真实点击里同步调用 speak()，且 cancel() 后立刻 speak() 会哑火
   *   · Android / 微信 的 getVoices() 首次为空，要等 voiceschanged + 轮询
   *   · 部分内核 speak() 不报错但永远不触发 onstart，需要超时判定
   * ============================================================ */
  var Speaker = (function(){
    var synth = null;
    try { synth = window.speechSynthesis || null; } catch(e){ synth = null; }
    var hasUtter = (typeof window.SpeechSynthesisUtterance === 'function');
    if(!synth || !hasUtter) synth = null;
    /* 是否连最基本的音频能力都没有（native 朗读 + 在线 TTS + audio 元素全缺）→ 极罕见才置灰 */
    var noAudio = (!synth) && !(window.Audio || window.webkitAudio);

    var SILENT_WAV = 'data:audio/wav;base64,UklGRsQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YaAAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
    var voices = [], voicesReady = false, unlocked = false;
    var audioEl = null, tipEl = null, tipTimer = 0;
    var audioCtx = null;
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    /* --- 语音包：异步加载 + 轮询兜底 --- */
    function loadVoices(){
      if(!synth) return;
      try { voices = synth.getVoices() || []; } catch(e){ voices = []; }
      if(voices.length) voicesReady = true;
    }
    loadVoices();
    if(synth){
      try { synth.onvoiceschanged = loadVoices; } catch(e){}
      try { synth.addEventListener && synth.addEventListener('voiceschanged', loadVoices); } catch(e){}
    }
    var pollN = 0;
    var pollId = setInterval(function(){
      loadVoices(); pollN++;
      if(voicesReady || pollN > 25) clearInterval(pollId);
    }, 300);

    function pickVoice(){
      loadVoices();
      if(!voices.length) return null;
      var i, v, n, lang;
      for(i = 0; i < voices.length; i++){
        v = voices[i]; lang = (v.lang || '').toLowerCase(); n = (v.name || '').toLowerCase();
        if(lang.indexOf('en') === 0 &&
           /zira|samantha|female|woman|aria|jenny|karen|moira|tessa|fiona|google us english/.test(n)) return v;
      }
      for(i = 0; i < voices.length; i++){
        if((voices[i].lang || '').toLowerCase().indexOf('en-us') === 0) return voices[i];
      }
      for(i = 0; i < voices.length; i++){
        if((voices[i].lang || '').toLowerCase().indexOf('en') === 0) return voices[i];
      }
      return null;
    }

    /* --- 首次有效交互时"解锁"音频：点击 / 触摸都试，直到真正解锁成功 --- */
    var audioPrimed = false;
    function unlock(){
      // Web Audio 上下文解锁（部分浏览器需要）
      try {
        if(!audioCtx && (window.AudioContext || window.webkitAudioContext)){
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch(e){}
      // 微信内置浏览器：用 WeixinJSBridge 主动解锁音频
      if(typeof WeixinJSBridge !== 'undefined'){
        try { WeixinJSBridge.invoke('getNetworkType', {}, function(){}); } catch(e){}
      }
      if(synth){
        try {
          var u = new SpeechSynthesisUtterance(' ');
          u.volume = 0; u.rate = 10; u.lang = 'en-US';
          synth.speak(u);
        } catch(e){}
      }
      primeAudio();
    }
    function primeAudio(){
      if(audioPrimed) return;
      var a = getAudio();
      if(!a) return;
      function done(){
        try { a.pause(); } catch(e){}
        audioPrimed = true;
        try { a.muted = false; } catch(e){}
      }
      try {
        a.muted = true;
        a.pause();
        a.src = SILENT_WAV;
        a.load();
        var p = a.play();
        if(p && p.then){
          p.then(done).catch(done);
        } else {
          done();
        }
      } catch(e){ done(); }
    }
    if(document.addEventListener){
      // 捕获阶段监听：按钮点击前先解锁
      document.addEventListener('click', unlock, true);
      document.addEventListener('touchstart', unlock, { passive:true });
    }

    function getAudio(){
      if(audioEl) return audioEl;
      try {
        audioEl = document.getElementById('tts-audio');
        if(!audioEl){
          audioEl = document.createElement('audio');
          audioEl.id = 'tts-audio';
          audioEl.preload = 'auto';
          audioEl.setAttribute('playsinline', '');
          audioEl.setAttribute('webkit-playsinline', '');
          audioEl.setAttribute('x5-playsinline', '');
          audioEl.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;';
          document.body.appendChild(audioEl);
        }
      } catch(e){ audioEl = null; }
      return audioEl;
    }

    /* --- 底部轻提示 --- */
    function tip(msg, ms){
      if(!tipEl){
        tipEl = document.createElement('div');
        tipEl.className = 'speak-tip';
        document.body.appendChild(tipEl);
      }
      tipEl.textContent = msg;
      tipEl.classList.add('show');
      clearTimeout(tipTimer);
      tipTimer = setTimeout(function(){ tipEl.classList.remove('show'); }, ms || 3200);
    }

    function mark(btn, cls){
      if(!btn) return;
      btn.classList.add('is-playing');
      if(cls) btn.classList.add(cls);
    }
    function unmark(btn){
      if(!btn) return;
      btn.classList.remove('is-playing');
      btn.classList.remove('is-net');
    }

    /* --- ② 在线发音兜底（多源轮询 + 等待可播放 + 失败重试） --- */
    function netAudio(text, btn){
      mark(btn);
      var a = getAudio();
      if(!a){ unmark(btn); tip('这个浏览器暂时读不了，跟着音标读一遍吧'); return; }
      var urls = [
        'https://dict.youdao.com/dictvoice?type=2&audio=' + encodeURIComponent(text),
        'https://dict.youdao.com/dictvoice?type=1&audio=' + encodeURIComponent(text),
        'https://fanyi.baidu.com/gettts?lan=en&spd=3&source=web&text=' + encodeURIComponent(text)
      ];
      var idx = 0, retried = false, timer = 0;
      function cleanup(){
        clearTimeout(timer);
        a.onplaying = null; a.onended = null; a.onerror = null; a.oncanplaythrough = null;
      }
      function fail(){
        cleanup();
        unmark(btn);
        tip(isIOS ? '读不出来：看看手机侧边静音键是不是打开了'
                  : '手机浏览器拦住了声音，先点一下屏幕空白处，再点朗读');
      }
      function tryNext(){
        if(idx >= urls.length){ fail(); return; }
        retried = false;
        var url = urls[idx];
        a.onplaying = function(){ if(btn) btn.classList.add('is-net'); };
        a.onended = function(){ cleanup(); unmark(btn); };
        a.onerror = function(){
          if(!retried){ retried = true; setTimeout(retrySame, 150); return; }
          idx++; tryNext();
        };
        a.oncanplaythrough = function(){
          a.oncanplaythrough = null;
          var p = a.play();
          if(p && p.catch){
            p.catch(function(){
              if(!retried){ retried = true; setTimeout(retrySame, 150); }
              else { idx++; tryNext(); }
            });
          }
        };
        function retrySame(){
          var p = a.play();
          if(p && p.catch){
            p.catch(function(){ idx++; tryNext(); });
          }
        }
        try {
          a.muted = false; a.pause(); a.src = url; a.load();
          // 已经就绪则直接尝试播放
          if(a.readyState >= 4){ retrySame(); }
        } catch(e){
          if(!retried){ retried = true; setTimeout(retrySame, 150); }
          else { idx++; tryNext(); }
        }
        // 单个源最多等 4 秒，超时换下一个
        timer = setTimeout(function(){
          if(!retried){ retried = true; setTimeout(retrySame, 150); }
          else { idx++; tryNext(); }
        }, 4000);
      }
      tryNext();
    }

    /* --- ① 原生朗读（带"是否真的开始"判定） --- */
    function native(text, btn, onFail){
      var st = { started:false, ended:false, tid:0 };
      function fail(){
        if(st.ended) return;
        st.ended = true;
        clearTimeout(st.tid);
        onFail();
      }
      var busy = false;
      try { busy = !!(synth.speaking || synth.pending || synth.paused); } catch(e){}
      if(busy){
        // iOS 坑：cancel() 后同一 tick 内 speak() 会哑火 → 隔一帧再说
        try { synth.cancel(); } catch(e){}
        setTimeout(function(){ reallySpeak(text, btn, st, fail); }, 90);
        return true;
      }
      return reallySpeak(text, btn, st, fail);
    }

    function reallySpeak(text, btn, st, fail){
      var u;
      try { u = new SpeechSynthesisUtterance(text); }
      catch(e){ return false; }
      u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1; u.volume = 1;
      var v = pickVoice(); if(v) u.voice = v;
      u.onstart = function(){ st.started = true; };
      u.onend   = function(){ if(st.ended) return; st.ended = true; clearTimeout(st.tid); unmark(btn); };
      u.onerror = function(){ unmark(btn); fail(); };
      try { synth.speak(u); } catch(e){ return false; }
      // iOS 偶发进入 paused，踢一下
      setTimeout(function(){ try { if(synth.paused) synth.resume(); } catch(e){} }, 150);
      // 1200ms 还没 onstart → 判定为"假支持"，转在线发音（手机网络慢/语音包加载慢时也够）
      st.tid = setTimeout(function(){
        if(!st.started && !st.ended){ unmark(btn); fail(); }
      }, 1200);
      return true;
    }

    /* --- 对外：读一段英文 --- */
    function speak(text, btn){
      if(!text) return;
      unlock();
      mark(btn);
      // 如果浏览器有 speechSynthesis 但没有任何语音包，直接走在线发音，不空等
      loadVoices();
      if(!synth || !voices.length){ netAudio(text, btn); return; }
      var ok = native(text, btn, function(){ netAudio(text, btn); });
      if(!ok) netAudio(text, btn);
    }

    /* 单词 + 短句：合成一次读完（手机上比链式两次 speak 稳得多） */
    function speakWordSentence(word, sentence, btn){
      var text = word;
      if(sentence) text = word + '. ' + sentence;
      speak(text, btn);
    }

    return { speak: speak, speakWordSentence: speakWordSentence, tip: tip, isIOS: isIOS, supported: !noAudio };
  })();

      if(it.en) ex += escHtml(it.en);
      if(it.cn) ex += ' <span class="review-cn">' + escHtml(it.cn) + '</span>';
      html += '<div class="review-ex">' + ex + '</div>';
    }
    html += '</div>';
    return html;
  }
  function buildEnglishReview(){
    var kids = visibleKids();
    var weeks = ENGLISH_WEEKS || [];
    if(!weeks.length) return '<div class="review-empty">暂时还没有往期英语素材～</div>';
    var html = '';
    weeks.forEach(function(wk, wi){
      var hasAny = false;
      kids.forEach(function(kid){
        var kd = wk[kid] || {};
        for(var d = 1; d <= 5; d++){ if(kd[d]) { hasAny = true; break; } }
      });
      if(!hasAny) return;
      html += '<div class="review-week">';
      html += '<div class="review-week-title">第' + (wk.week || (wi+1)) + '周（' + wk.start + ' ~ ' + wk.end + '）</div>';
      kids.forEach(function(kid){
        var kd = wk[kid] || {};
        for(var d = 1; d <= 5; d++){
          if(kd[d]) html += engReviewItemHTML(kd[d], d, kid);
        }
      });
      html += '</div>';
    });
    if(!html) html = '<div class="review-empty">暂时还没有往期英语素材～</div>';
    return html;
  }
  function sentenceReviewItemHTML(it, dateS, kid){
    var tName = (it.topic && TOPIC_MAP[it.topic]) ? (TOPIC_MAP[it.topic].icon + ' ' + TOPIC_MAP[it.topic].name) : '';
    var html = '<div class="review-item">';
    html += '<div class="review-item-head">';
    html += '<span class="review-kid ' + kid + '">' + KID_NAMES[kid] + '</span>';
    if(dateS) html += '<span class="review-day">' + dateS + '</span>';
    if(tName) html += '<span class="review-type">' + tName + '</span>';
    html += '</div>';
    html += '<div class="review-ts-main">' + it.main + '</div>';
    if(it.extra) html += '<div class="review-ts-extra">' + it.extra + '</div>';
    html += '</div>';
    return html;
  }
  /* 往日回顾「今日一句话」：按 SENT_SCHED 列表 + 主题筛选 + 正文搜索 */
  var sentenceFilter = '';   // '' = 全部主题
  var senQuery = '';         // '' = 不限，非空 = 搜正文关键词
  /* 去掉 HTML 标签取纯文本（用于搜索匹配正文关键词） */
  function stripHtml(s){
    if(!s) return '';
    return String(s).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  }
  /* 一条句子是否通过当前主题筛选 + 正文搜索 */
  function sentencePass(it){
    if(!it || !it.main) return false;
    if(sentenceFilter && it.topic !== sentenceFilter) return false;
    if(senQuery){
      var q = senQuery.toLowerCase();
      var hay = (stripHtml(it.main) + ' ' + stripHtml(it.extra)).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }
  /* 渲染搜索条 + 主题筛选条（固定头部展示，随内容重建不重绑输入框） */
  function sentenceFilterBar(){
    var chips = '<button type="button" class="rf-chip' + (sentenceFilter === '' ? ' on' : '') + '" data-topic="">全部</button>';
    TOPICS.forEach(function(t){
      var short = TOPIC_SHORT[t.id] || t.name;
      chips += '<button type="button" class="rf-chip' + (sentenceFilter === t.id ? ' on' : '') + '" data-topic="' + t.id + '" title="' + t.icon + ' ' + t.name + '">' + t.icon + ' ' + short + '</button>';
    });
    return '<div class="review-filter">' + chips + '</div>';
  }
  function buildSentenceReview(){
    var kids = visibleKids();
    var weeks = SENT_SCHED || [];
    if(!weeks.length) return '<div class="review-empty">暂时还没有往期一句话～</div>';
    var html = sentenceFilterBar();
    var matched = 0;
    weeks.forEach(function(wk, wi){
      var hasAny = false;
      kids.forEach(function(kid){
        var per = wk[kid] || {};
        Object.keys(per).forEach(function(d){
          var it = per[d];
          if(sentencePass(it)){ hasAny = true; matched++; }
        });
      });
      if(!hasAny) return;
      var wLab = (wk.week !== undefined) ? ('第' + wk.week + '周') : ('第' + (wi+1) + '周');
      html += '<div class="review-week">';
      html += '<div class="review-week-title">' + wLab + '（' + wk.start + ' ~ ' + wk.end + '）</div>';
      kids.forEach(function(kid){
        var per = wk[kid] || {};
        var dates = Object.keys(per).sort();
        dates.forEach(function(d){
          var it = per[d];
          if(sentencePass(it)) html += sentenceReviewItemHTML(it, d, kid);
        });
      });
      html += '</div>';
    });
    if(!matched){
      html = sentenceFilterBar()
        + (senQuery
            ? '<div class="review-empty">没找到和「' + escHtml(senQuery) + '」相关的一句话～换个词试试</div>'
            : '<div class="review-empty">这个主题还没有历史内容～</div>');
    }
    return html;
  }

  /* 共学主题 · 往日回顾：列出全部共学周，点击进入对应周页面 */
  function buildHistoryReview(){
    var weeks = (data.weeks || []).slice().sort(function(a, b){ return (a.week || 0) - (b.week || 0); });
    var html = '';
    weeks.forEach(function(w){
      if(!matchMode(w.owner || 'both')) return;
      var href = (w.file || ('week-' + pad(w.week) + '.html')) + '?v=20260903';
      html += '<a class="review-history-item" href="' + escHtml(href) + '">';
      html += '<span class="rh-num">第' + (w.week || 0) + '周</span>';
      html += '<div class="rh-main">';
      html += '<div class="rh-title">' + escHtml(w.title || '共学主题') + '</div>';
      if(w.desc) html += '<div class="rh-desc">' + escHtml(w.desc) + '</div>';
      html += '</div>';
      html += '<span class="rh-go">→</span>';
      html += '</a>';
    });
    if(!html) html = '<div class="review-empty">暂时还没有共学内容～</div>';
    return html;
  }

  /* ============================================================
   * 事件层
   * ============================================================ */
  function bindEvents(){
    var switcher = document.getElementById('modeSwitch');
    switcher.addEventListener('click', function(ev){
      var btn = ev.target.closest ? ev.target.closest('button') : null;
      if(!btn || !switcher.contains(btn)) return;
      var mode = btn.getAttribute('data-mode');
      if(!mode || mode === state.mode) return;
      setMode(mode);   // 切换 + 记忆
    });

    // 首次打开：身份选择按钮
    document.querySelectorAll('.welcome-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var u = btn.getAttribute('data-user');
        if(u !== 'yueyue' && u !== 'chengcheng') return;
        setStoredUser(u);
        state.mode = u;
        applyTheme();
        hideWelcome();
        refreshAll();
      });
    });

    // 周六提示：切换到共读 / 关闭
    var shGo = document.getElementById('shGo');
    if(shGo) shGo.addEventListener('click', function(){ setMode('all'); });
    var shClose = document.getElementById('shClose');
    if(shClose) shClose.addEventListener('click', function(){
      try { localStorage.setItem(SAT_CLOSED_PREFIX + dateStr(), '1'); } catch(e){}
      var box = document.getElementById('saturdayHint');
      if(box) box.hidden = true;
    });

    // 导出 / 导入成长数据（学习小屋相关的 localStorage 键）
    function allowKey(k){ return k === IDENTITY_KEY || k === 'wb_readlog' || k.indexOf('wb_daily_') === 0 || k.indexOf(SAT_CLOSED_PREFIX) === 0; }

    // 通用下载函数
    function downloadJSON(obj, filename){
      try{
        var blob = new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){ URL.revokeObjectURL(url); document.body.removeChild(a); }, 300);
        return true;
      }catch(e){ return false; }
    }

    // 全部导出（玥玥+程程完整数据）
    var expAll = document.getElementById('exportAll');
    if(expAll) expAll.addEventListener('click', function(){
      var out = {}, i, k;
      for(i = 0; i < localStorage.length; i++){
        k = localStorage.key(i);
        if(k && allowKey(k)) out[k] = localStorage.getItem(k);
      }
      if(downloadJSON(out, 'learning-house-all-' + dateStr() + '.json')){
        if(typeof Speaker !== 'undefined') Speaker.tip('已导出全部成长数据');
      }else{
        if(typeof Speaker !== 'undefined') Speaker.tip('导出失败，请重试');
      }
    });

    // 按孩子导出单人数据
    function exportChild(kid, kidName){
      var out = { _child: kid };
      // 阅读记录：只取该孩子部分
      var readlog = {};
      try{
        var allRl = JSON.parse(localStorage.getItem('wb_readlog') || '{}');
        if(allRl[kid] && allRl[kid].length) readlog[kid] = allRl[kid];
      }catch(e){}
      out['wb_readlog'] = JSON.stringify(readlog);
      // 每日打卡：只取包含该孩子的键
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(k && k.indexOf('wb_daily_') === 0 && k.indexOf('_' + kid + '_') !== -1){
          out[k] = localStorage.getItem(k);
        }
      }
      if(downloadJSON(out, 'learning-house-' + kidName + '-' + dateStr() + '.json')){
        if(typeof Speaker !== 'undefined') Speaker.tip('已导出' + kidName + '的成长数据');
      }else{
        if(typeof Speaker !== 'undefined') Speaker.tip('导出失败，请重试');
      }
    }

    var expYue = document.getElementById('exportYue');
    if(expYue) expYue.addEventListener('click', function(){ exportChild('yueyue', '玥玥'); });
    var expCheng = document.getElementById('exportCheng');
    if(expCheng) expCheng.addEventListener('click', function(){ exportChild('chengcheng', '程程'); });

    // 导入：自动识别全量备份或单人备份
    var impBtn = document.getElementById('importData');
    var impFile = document.getElementById('importFile');
    if(impBtn && impFile) impBtn.addEventListener('click', function(){ impFile.click(); });
    if(impFile) impFile.addEventListener('change', function(){
      var f = impFile.files && impFile.files[0];
      impFile.value = '';
      if(!f) return;
      var rd = new FileReader();
      rd.onload = function(){
        try{
          var data = JSON.parse(rd.result);
          if(!data || typeof data !== 'object') throw new Error('bad');
          var n = 0;
          var child = data._child;
          if(child){
            // 单人备份：只合并对应孩子数据
            if(data['wb_readlog']){
              try{
                var existing = JSON.parse(localStorage.getItem('wb_readlog') || '{}');
                var incoming = JSON.parse(data['wb_readlog']);
                if(incoming[child]){ existing[child] = incoming[child]; localStorage.setItem('wb_readlog', JSON.stringify(existing)); n++; }
              }catch(e){}
            }
            Object.keys(data).forEach(function(k){
              if(k.indexOf('wb_daily_') === 0 && k.indexOf('_' + child + '_') !== -1){
                try{ localStorage.setItem(k, data[k]); n++; }catch(e){}
              }
            });
            var cn = (child === 'yueyue') ? '玥玥' : '程程';
            if(typeof Speaker !== 'undefined') Speaker.tip('已导入' + cn + '的 ' + n + ' 条数据，即将刷新');
          }else{
            // 全量备份：覆盖全部
            Object.keys(data).forEach(function(k){
              if(allowKey(k)){ try{ localStorage.setItem(k, data[k]); n++; }catch(e){} }
            });
            if(typeof Speaker !== 'undefined') Speaker.tip('已导入 ' + n + ' 条成长数据，即将刷新');
          }
          setTimeout(function(){ location.reload(); }, 800);
        }catch(e){
          if(typeof Speaker !== 'undefined') Speaker.tip('文件格式不对，请选择导出的 JSON');
        }
      };
      rd.readAsText(f);
    });


    // ===== 今日一句话：日历选择日期+孩子查看历史 =====
    (function(){
      var dateRow = document.getElementById('datePickerRow');
      var dateEl  = document.getElementById('todayDate');
      var pick    = document.getElementById('datePick');
      var btnYue  = document.getElementById('dpKidYue');
      var btnCheng= document.getElementById('dpKidCheng');
      var btnReset= document.getElementById('datePickReset');
      if(!dateRow || !dateEl || !pick || !btnYue || !btnCheng) return;

      function refreshKidBtns(){
        btnYue.classList.toggle('on', sentViewKid === 'yueyue');
        btnCheng.classList.toggle('on', sentViewKid === 'chengcheng');
      }
      function refreshReset(){
        if(btnReset) btnReset.hidden = !sentViewDate && !sentViewKid;
      }
      function applyView(){
        refreshKidBtns();
        refreshReset();
        renderTodayDate();
        renderSentences();
      }

      // 点击日期文字 → 展开/收起选择面板
      dateEl.addEventListener('click', function(){
        var show = dateRow.hasAttribute('hidden');
        if(show){
          dateRow.removeAttribute('hidden');
          dateRow.style.display = 'flex';
          pick.value = sentViewDate || dateStr();
          refreshKidBtns();
        }else{
          dateRow.setAttribute('hidden', '');
          dateRow.style.display = 'none';
        }
      });

      // 选择日期 → 立即显示那天的句子
      pick.addEventListener('change', function(){
        sentViewDate = pick.value || null;
        applyView();
      });

      // 切换孩子
      btnYue.addEventListener('click', function(){
        sentViewKid = (sentViewKid === 'yueyue') ? null : 'yueyue';
        applyView();
      });
      btnCheng.addEventListener('click', function(){
        sentViewKid = (sentViewKid === 'chengcheng') ? null : 'chengcheng';
        applyView();
      });

      // 回到今天
      if(btnReset) btnReset.addEventListener('click', function(){
        sentViewDate = null;
        sentViewKid = null;
        pick.value = dateStr();
        dateRow.setAttribute('hidden', '');
        dateRow.style.display = 'none';
        applyView();
      });
    })();

    // 今日一句话卡片：点击展开/收起补充内容
    document.getElementById('sentenceCards').addEventListener('click', function(ev){
      var card = ev.target.closest ? ev.target.closest('.ts-card') : null;
      if(!card) return;
      var extra = card.querySelector('.ts-extra');
      if(extra) extra.hidden = !extra.hidden;
    });

    // 每日英语：点击🔊朗读"单词 + 短句"；
    // 手机上点单词本体 / 英文句子也能单独读（点按目标更大，孩子更好按）
    var englishBody = document.getElementById('englishBody');
    if(englishBody) englishBody.addEventListener('click', function(ev){
      var t = ev.target;
      // 手机上点击目标经常是文本节点，文本节点没有 closest()，归一化到父元素
      if(t && t.nodeType === 3 && t.parentNode) t = t.parentNode;
      var btn = t.closest ? t.closest('.speak-btn') : null;
      if(btn){
        var word = btn.getAttribute('data-word');
        var sentence = btn.getAttribute('data-sentence');
        if(word) Speaker.speakWordSentence(word, sentence, btn);
        return;
      }
      var w = t.closest ? t.closest('.eng-word') : null;
      if(w){ Speaker.speak(w.textContent, w); return; }
      var en = t.closest ? t.closest('.eng-sentence') : null;
      if(en){
        var span = en.querySelector('span');
        var txt = span ? span.textContent : en.textContent;
        txt = String(txt || '').replace(/\s+/g, ' ').trim();
        if(txt) Speaker.speak(txt, en);
      }
    });

    // 打卡 checkbox：打勾变绿 + 存 localStorage（按日期存，跨天自动重置）
    document.getElementById('checkRow').addEventListener('change', function(ev){
      var input = ev.target;
      if(input.tagName !== 'INPUT') return;
      var kid = input.getAttribute('data-kid');
      var kind = input.getAttribute('data-kind');
      setDone(kid, kind, input.checked);
      var item = input.closest('.check-item');
      if(item) item.classList.toggle('done', input.checked);
      renderStreaks();
    renderWeekSummary();
      if(input.checked && typeof Speaker !== 'undefined'){
        var msgs = ['太棒了！继续保持~', '做得好！一天天进步~', '厉害！又完成一项~', '加油！你真棒~'];
        Speaker.tip(msgs[Math.floor(Math.random() * msgs.length)]);
      }
    });

    // 视频链接：微信 / 手机浏览器偶尔会拦掉新窗口跳转，
    // 1.5 秒后页面还在（说明没跳走）就提示"用右上角菜单在浏览器里打开"
    var videoList = document.getElementById('videoList');
    if(videoList) videoList.addEventListener('click', function(ev){
      var a = ev.target.closest ? ev.target.closest('.video-btn') : null;
      if(!a) return;
      var href = a.getAttribute('href');
      if(!href || href === '#') return;
      setTimeout(function(){
        if(document.hidden || document.webkitHidden) return;   // 已经跳走了
        window.__videoFallbackUrl = href;
        var tipBox = document.getElementById('videoFallback');
        if(tipBox){
          tipBox.hidden = false;
          var go = document.getElementById('vfOpen');
          if(go) go.onclick = function(){
            try { window.location.href = href; } catch(e){}
          };
        }
      }, 1500);
    });
    var vfClose = document.getElementById('vfClose');
    if(vfClose) vfClose.addEventListener('click', function(){
      var tipBox = document.getElementById('videoFallback');
      if(tipBox) tipBox.hidden = true;
    });

    // 往日回顾：打开 / 关闭
    var reviewEnglish = document.getElementById('reviewEnglish');
    if(reviewEnglish) reviewEnglish.addEventListener('click', function(){ openReview('english'); });
    var reviewSentence = document.getElementById('reviewSentence');
    if(reviewSentence) reviewSentence.addEventListener('click', function(){ openReview('sentence'); });
    var reviewHistory = document.getElementById('reviewHistory');
    if(reviewHistory) reviewHistory.addEventListener('click', function(){ openReview('history'); });
    var reviewClose = document.getElementById('reviewClose');
    if(reviewClose) reviewClose.addEventListener('click', closeReview);
    var reviewMask = document.getElementById('reviewMask');
    if(reviewMask) reviewMask.addEventListener('click', function(ev){ if(ev.target === reviewMask) closeReview(); });
    // 往日回顾里的朗读按钮 / 主题筛选 chip（事件委托，弹层内容每次重建但容器不变）
    var reviewBody = document.getElementById('reviewBody');
    if(reviewBody) reviewBody.addEventListener('click', function(ev){
      var t = ev.target;
      if(t && t.nodeType === 3 && t.parentNode) t = t.parentNode;
      var chip = t.closest ? t.closest('.rf-chip') : null;
      if(chip){
        sentenceFilter = chip.getAttribute('data-topic') || '';
        reviewBody.innerHTML = buildSentenceReview();
        try { reviewBody.scrollTop = 0; } catch(e){}
        return;
      }
      var btn = t.closest ? t.closest('.speak-btn') : null;
      if(!btn) return;
      var word = btn.getAttribute('data-word');
      var sentence = btn.getAttribute('data-sentence');
      if(word) Speaker.speakWordSentence(word, sentence, btn);
    });

    // 往日回顾「今日一句话」正文搜索：输入防抖 → 更新 senQuery → 重建列表
    var senSearch = document.getElementById('senSearch');
    var senSearchClear = document.getElementById('senSearchClear');
    if(senSearch){
      var senDebounce = null;
      var applySenSearch = function(){
        senQuery = senSearch.value.trim();
        if(senSearchClear) senSearchClear.hidden = !senQuery;
        var body = document.getElementById('reviewBody');
        if(body) body.innerHTML = buildSentenceReview();
        try { if(body) body.scrollTop = 0; } catch(e){}
      };
      senSearch.addEventListener('input', function(){
        if(senDebounce) clearTimeout(senDebounce);
        senDebounce = setTimeout(applySenSearch, 200);
      });
      senSearch.addEventListener('search', applySenSearch);  // 兼容自带清空X
      if(senSearchClear) senSearchClear.addEventListener('click', function(){
        senSearch.value = '';
        if(senDebounce) clearTimeout(senDebounce);
        applySenSearch();
        senSearch.focus();
      });
    }

    document.addEventListener('keydown', function(ev){
      if(ev.key === 'Escape'){ var m = document.getElementById('reviewMask'); if(m && !m.hidden) closeReview(); }
    });
  }

  /* ============================================================
   * 初始化：加载数据 → 绑定事件 → 统一渲染
   * ============================================================ */
  function init(){
    bindEvents();
    applyTheme();
    loadWeather();   // 日期天气：默认广州兜底，允许定位后实时更新
    renderEncourage();
    var stored = getStoredUser();
    state.mode = modeFromUser(stored);
    applyTheme();
    renderHeader();        // 首帧前把标题/副标题切到当前模式（data 异步期间不闪旧）
    fillWelcomeGrades();   // 欢迎窗按钮年级先填好，再 showWelcome
    renderFooter();        // 底部版权（随学年配置）
    loadData(function(){
      refreshAll();
      if(!stored){ showWelcome(); }   // 第一次打开 → 弹身份选择
    });
    // 跨天自动重置：每半分钟检查一次日期，0点过后自动刷新今日区域与周六提示
    var lastDate = dateStr();
    setInterval(function(){
      if(dateStr() !== lastDate){
        lastDate = dateStr();
        renderTodaySection();
        renderSaturdayHint();
      }
    }, 30000);
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  }else{
    init();
  }
})();
</script>
<script>
/* 缓存刷新：给站内未加戳的链接统一加版本戳，避免手机浏览器读到旧版 */
(function(){
  var v='?v=20260903';
  var links=document.querySelectorAll('a[href]');
  for(var i=0;i<links.length;i++){
    var h=links[i].getAttribute('href');
    if(!h) continue;
    if(/^https?:|^#|^javascript:|^mailto:/i.test(h)) continue;
    if(h.indexOf('?')!==-1) continue;
    links[i].setAttribute('href', h+v);
  }
})();
</script>
